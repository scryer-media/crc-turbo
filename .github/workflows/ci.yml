name: ci

# Every lane upstream's tests.yml ran (aarch64, x86_64, 32-bit x86, the
# software fallback on big-endian PowerPC, Miri, no_std, WASM, fuzzing), plus
# the `hygiene` checks on the tree, fmt, clippy, docs, MSRV and packaging.
# `ci-complete` is the one required check: it fails unless every lane
# succeeded.

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: crc-turbo-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.1
  # Miri and cargo-fuzz need a nightly; pinned, so a run is reproducible and a
  # nightly regression is not mistaken for a finding.
  NIGHTLY_TOOLCHAIN: nightly-2026-09-01
  CARGO_FUZZ_VERSION: 0.13.2
  CROSS_VERSION: 0.2.5
  # Pinned runtimes for the wasm-test lanes. Bump the emsdk release and the
  # commit its tag names together.
  WASMTIME_VERSION: 50.0.1
  EMSDK_VERSION: 7.0.0
  EMSDK_COMMIT: 1693ce7359fc9694f198694f902a2cc061239b86

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No binary files and no generated fixtures
        run: |
          set -eu
          # Whatever Git counts as binary, by content rather than extension,
          # so a renamed blob is caught too. The crate's only fixture is the
          # nine-byte crc-check.txt the README's examples read.
          empty="$(git hash-object -t tree /dev/null)"
          binary="$(git diff --numstat "$empty" HEAD | awk '$1 == "-" { print $3 }')"
          if [ -n "$binary" ]; then
            echo "binary files are generated, never committed:" >&2
            echo "$binary" >&2
            exit 1
          fi
          if git ls-files | grep -E '\.(bin|7z|rar|xz|lzma|zip|gz|zst)$'; then
            echo "test inputs and archives are generated, never committed" >&2
            exit 1
          fi
          if git ls-files -- fuzz/artifacts fuzz/corpus fuzz/coverage test | grep .; then
            echo "these directories are generated by the fuzzer and the tests and stay untracked" >&2
            exit 1
          fi
      - name: No personal home paths
        run: |
          set -eu
          # A home path names its account; only the conventional placeholders
          # may appear. The
          # bracketed letters keep this file from matching itself.
          found="$(git grep -nIE '(/U[s]ers/|/h[o]me/|[Cc]:[\\/][Uu]sers[\\/])[A-Za-z0-9._-]+' \
            | grep -vE '(/U[s]ers/|/h[o]me/|[Cc]:[\\/][Uu]sers[\\/])(example|user|username|youruser|your-user|someuser|testuser|test-user|alice|bob|runner)([^A-Za-z0-9._-]|$)' || true)"
          if [ -n "$found" ]; then
            echo "personal paths are not committed:" >&2
            echo "$found" >&2
            exit 1
          fi
      - name: No credentials
        run: |
          set -eu
          # Token shapes with a fixed prefix: private keys, GitHub, AWS,
          # Slack, crates.io and OpenAI-style keys.
          found="$(git grep -nIE -- '-----BEGIN ([A-Z]+ )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{40,}|AKIA[0-9A-Z]{16}|xox[abprs]-[A-Za-z0-9-]{10,}|cio[A-Za-z0-9]{32}|sk-[A-Za-z0-9]{32,}' || true)"
          if [ -n "$found" ]; then
            echo "credential-shaped strings are not committed:" >&2
            echo "$found" | cut -c1-80 >&2
            exit 1
          fi

  fmt:
    name: fmt
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --all --check --manifest-path fuzz/Cargo.toml
      - run: cargo fmt --all --check --manifest-path capi/Cargo.toml

  # Each architecture compiles different tiers, so clippy runs on each.
  clippy:
    name: clippy-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-26.04
          - platform: linux-aarch64
            runner: ubuntu-26.04-arm
          - platform: macos-aarch64
            runner: macos-15
          - platform: windows-x86_64
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - name: All features
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Default features
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: No default features
        run: cargo clippy --locked --lib --no-default-features -- -D warnings
      - name: alloc without std
        run: cargo clippy --locked --lib --no-default-features --features alloc -- -D warnings
      - name: cache without std
        run: cargo clippy --locked --lib --no-default-features --features cache -- -D warnings
      - name: generated tables without std
        run: cargo clippy --locked --lib --no-default-features --features generated-tables -- -D warnings

  docs:
    name: docs
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo doc --locked --no-deps --all-features

  test:
    name: test-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-26.04
          - platform: linux-aarch64
            runner: ubuntu-26.04-arm
          - platform: macos-aarch64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: windows-x86_64
            runner: windows-2025
          - platform: windows-aarch64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Which tier this runner gets
        run: cargo run --locked --features cli --bin arch-check
      - name: Test all features
        run: cargo test --locked --workspace --all-features --no-fail-fast
      - name: Test default features
        run: cargo test --locked --no-fail-fast

  # 32-bit x86 on Linux runs natively on the x86_64 runner with the multilib
  # toolchain; upstream ran the same targets through cross.
  test-x86-linux:
    name: test-${{ matrix.target }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [i586-unknown-linux-gnu, i686-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Install the 32-bit C toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Which tier this target gets
        run: cargo run --locked --features cli --bin arch-check --target ${{ matrix.target }}
      - name: Test
        run: cargo test --locked --all-features --target ${{ matrix.target }} --no-fail-fast

  test-x86-windows:
    name: test-i686-pc-windows-msvc
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: i686-pc-windows-msvc
          components: clippy
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features --target i686-pc-windows-msvc -- -D warnings
      - name: Which tier this target gets
        run: cargo run --locked --features cli --bin arch-check --target i686-pc-windows-msvc
      - name: Test
        run: cargo test --locked --all-features --target i686-pc-windows-msvc --no-fail-fast

  # The table-driven fallback, on big-endian targets with no accelerated tier.
  test-software:
    name: test-${{ matrix.target }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [powerpc-unknown-linux-gnu, powerpc64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Install cross
        run: cargo install cross --locked --version "$CROSS_VERSION"
      - name: Which tier this target gets
        run: cross run --locked --features cli --bin arch-check --target ${{ matrix.target }}
      - name: Test
        run: cross test --locked --all-features --target ${{ matrix.target }} --no-fail-fast

  miri:
    name: miri-x86_64
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          components: miri, rust-src
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-nextest@0.9.143
      - name: Set up Miri
        run: cargo "+$NIGHTLY_TOOLCHAIN" miri setup
      - name: Miri
        run: cargo "+$NIGHTLY_TOOLCHAIN" miri nextest run --locked --all-features -j "$(nproc)"

  no-std:
    name: no-std-${{ matrix.target }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7em-none-eabihf # ARM Cortex-M4F/M7F
          - thumbv8m.main-none-eabihf # ARM Cortex-M33/M35P
          - riscv32imac-unknown-none-elf # RISC-V 32-bit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: no_std, no features
        run: cargo check --locked --target ${{ matrix.target }} --no-default-features --lib
      - name: no_std with the panic handler
        run: cargo check --locked --target ${{ matrix.target }} --no-default-features --features panic-handler --lib
      - name: no_std with alloc
        run: cargo check --locked --target ${{ matrix.target }} --no-default-features --features alloc,panic-handler --lib
      - name: no_std with cache
        run: cargo check --locked --target ${{ matrix.target }} --no-default-features --features cache,panic-handler --lib
      - name: no_std with generated tables
        run: cargo check --locked --target ${{ matrix.target }} --no-default-features --features generated-tables,panic-handler --lib
      - name: no_std tests (on the host)
        run: cargo test --locked --test no_std_tests

  wasm:
    name: wasm-${{ matrix.target }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-unknown-unknown, wasm32-wasip1, wasm32-wasip2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: No features
        run: cargo check --locked --target ${{ matrix.target }} --no-default-features --features panic-handler --lib
      - name: alloc
        run: cargo check --locked --target ${{ matrix.target }} --no-default-features --features alloc,panic-handler --lib
      - name: cache
        run: cargo check --locked --target ${{ matrix.target }} --no-default-features --features cache,panic-handler --lib
      - name: Release build
        run: cargo build --locked --target ${{ matrix.target }} --no-default-features --features alloc,panic-handler --lib --release
      - name: WASM tests (on the host)
        run: cargo test --locked --test wasm_tests
      # A module using one algorithm carries that algorithm's table, not all
      # fifty, even without LTO: one 32 KiB table plus code. It was 718 KiB
      # when every call linked every table.
      - name: Module size, one algorithm, no LTO
        if: matrix.target == 'wasm32-unknown-unknown'
        working-directory: wasm-size
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown
          wasm=target/wasm32-unknown-unknown/release/crc_turbo_wasm_size.wasm
          size=$(stat -c %s "$wasm")
          echo "CRC-64/NVME module: $size bytes"
          test "$size" -le 65536
          node check.mjs "$wasm"

  # The test suite compiled for WebAssembly and run there: WASI 0.1 and 0.2
  # under wasmtime, Emscripten under Node. WebAssembly has no CRC instructions,
  # so this is the table-driven software path, checked by the same tests as
  # every native tier. Tests that spawn threads, and the C header check that
  # regenerates the header from the host checkout, are ignored on wasm.
  # Emscripten runs the library and integration tests but not the doctests:
  # rustdoc runs each doctest outside the checkout, where the examples' input
  # file is not found.
  wasm-test:
    name: wasm-test-${{ matrix.target }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-wasip1, wasm32-wasip2, wasm32-unknown-emscripten]
    env:
      TARGET: ${{ matrix.target }}
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir .
      CARGO_TARGET_WASM32_WASIP2_RUNNER: wasmtime run --dir .
      CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_RUNNER: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Set up wasmtime
        if: matrix.target != 'wasm32-unknown-emscripten'
        uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: ${{ env.WASMTIME_VERSION }}
      - name: Verify the pinned wasmtime is the one on PATH
        if: matrix.target != 'wasm32-unknown-emscripten'
        run: |
          set -euo pipefail
          wasmtime --version
          wasmtime --version | grep -qF "wasmtime $WASMTIME_VERSION"
      - name: Set up Emscripten
        if: matrix.target == 'wasm32-unknown-emscripten'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/emsdk"
          # Fetched by commit, not by tag: a tag can be moved, a commit cannot.
          git init -q "$root"
          git -C "$root" fetch -q --depth 1 \
            https://github.com/emscripten-core/emsdk.git "$EMSDK_COMMIT"
          git -C "$root" checkout -q FETCH_HEAD
          "$root/emsdk" install "$EMSDK_VERSION"
          "$root/emsdk" activate "$EMSDK_VERSION"
          emsdk_version="$EMSDK_VERSION"
          # emsdk_env.sh reads variables that may be unset.
          set +u
          # shellcheck disable=SC1091
          source "$root/emsdk_env.sh"
          set -u
          # emsdk_env.sh clears EMSDK_VERSION, so the pin is read from the copy.
          # Read whole before matching: a reader that closes the pipe early
          # fails emcc under pipefail.
          reported="$(emcc --version)"
          grep -qF "$emsdk_version" <<<"$reported"
          node --version
          {
            echo "$EMSDK/upstream/emscripten"
            dirname "$EMSDK_NODE"
          } >> "$GITHUB_PATH"
          {
            echo "EMSDK=$EMSDK"
            echo "EM_CONFIG=$EMSDK/.emscripten"
            # The host filesystem through Node, a heap that grows past the
            # fixed 16 MiB default, and a 1 MiB stack in place of the 64 KiB
            # default.
            echo "RUSTFLAGS=-C link-arg=-sNODERAWFS=1 -C link-arg=-sALLOW_MEMORY_GROWTH=1 -C link-arg=-sSTACK_SIZE=1MB"
          } >> "$GITHUB_ENV"
      - name: Test default features
        run: |
          set -euo pipefail
          if [ "$TARGET" = wasm32-unknown-emscripten ]; then
            cargo test --locked --target "$TARGET" --lib --tests --no-fail-fast
          else
            cargo test --locked --target "$TARGET" --no-fail-fast
          fi
      - name: Test with cache, generated tables and digest 0.11
        run: |
          set -euo pipefail
          if [ "$TARGET" = wasm32-unknown-emscripten ]; then
            cargo test --locked --target "$TARGET" --lib --tests --no-fail-fast \
              --features cache,generated-tables,digest-0-11
          else
            cargo test --locked --target "$TARGET" --no-fail-fast \
              --features cache,generated-tables,digest-0-11
          fi

  # A short run of every target on both architectures with accelerated tiers.
  # A crash fails the lane; the input is kept as an artifact.
  fuzz:
    name: fuzz-${{ matrix.platform }}-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, linux-aarch64]
        target:
          - digest_crc32_autosar
          - digest_crc32_bzip2
          - digest_crc32_iscsi
          - digest_crc32_iso_hdlc
          - digest_crc64_ecma_182
          - digest_crc64_nvme
          - checksum_crc32_autosar
          - checksum_crc32_bzip2
          - checksum_crc32_iscsi
          - checksum_crc32_iso_hdlc
          - checksum_crc64_ecma_182
          - checksum_crc64_nvme
        include:
          - platform: linux-x86_64
            runner: ubuntu-26.04
          - platform: linux-aarch64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo "+$NIGHTLY_TOOLCHAIN" fuzz run "$TARGET" -- \
            -max_total_time=60 -rss_limit_mb=2048 -print_final_stats=1
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-findings-${{ matrix.platform }}-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore

  msrv:
    name: msrv
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read rust-version from the crate manifest
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: thumbv7em-none-eabihf, wasm32-unknown-unknown
      - name: The crate and its CLI tools
        run: cargo "+$MSRV" check --locked --all-features
      - name: no_std
        run: cargo "+$MSRV" check --locked --lib --no-default-features --features cache --target thumbv7em-none-eabihf
      - name: WASM
        run: cargo "+$MSRV" check --locked --lib --no-default-features --features alloc --target wasm32-unknown-unknown

  package:
    name: package
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: The crates.io archive builds
        run: cargo package --locked -p crc-turbo

  capi:
    name: capi (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: The C library builds
        if: runner.os == 'Windows'
        run: cargo build --locked --release --manifest-path capi/Cargo.toml
      - name: The C smoke test passes against the static and the shared library
        if: runner.os != 'Windows'
        run: make capi-test

  # What the compiler made of the hot paths, against codegen/<target>.snap:
  # exact on the pinned toolchain, and within the snapshot's margin as a
  # dependent crate would build it and on the oldest supported compiler. The
  # inline assembly has to be the same in all three.
  codegen:
    name: codegen-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64
            runner: ubuntu-26.04
          - platform: aarch64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read rust-version from the crate manifest
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: The pinned build matches the snapshot
        run: cargo xtask codegen check
      - name: As a dependent crate builds it by default
        run: cargo xtask codegen check --profile consumer
      - name: The oldest supported compiler
        run: cargo "+$MSRV" xtask codegen check

  ci-complete:
    name: ci-complete
    if: always()
    needs: [hygiene, fmt, clippy, docs, test, test-x86-linux, test-x86-windows, test-software, miri, no-std, wasm, wasm-test, fuzz, msrv, package, capi, codegen]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # Every required lane must have succeeded: a skipped lane is as much a
      # gap as a failed one.
      - name: Require every lane to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json, os; assert all(job["result"] == "success" for job in json.loads(os.environ["RESULTS"]).values()), os.environ["RESULTS"]'
