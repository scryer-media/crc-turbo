title = "crc-turbo gitleaks config"

# A config file replaces the built-in rules; without this the scan has none.
[extend]
useDefault = true

[allowlist]
description = "allow obvious examples and test placeholders"
regexes = [
  '''example\.com''',
  '''(?i)(example|sample|placeholder|changeme|replace-me|replace_me|dummy|fake|test[-_]?key|test[-_]?token)''',
]
